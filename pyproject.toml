[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scout"
dynamic = ["version"]
description = "Inspect public repositories for usefulness and static risk evidence before adoption."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Waiga Arya" }]
keywords = ["github", "static-analysis", "developer-tools", "ai-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
repo-scout = "repo_scout.cli:main"

[tool.setuptools]
packages = ["repo_scout"]

# One source of truth for the version, and one that is readable
# without installing: `importlib.metadata` alone reported
# `0+unknown` from a fresh clone, and in a zipapp reported
# whatever happened to be installed in the environment rather than
# the code being executed.
[tool.setuptools.dynamic]
version = { attr = "repo_scout.__version__" }
