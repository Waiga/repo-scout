name: Bug report
description: Report reproducible behavior that differs from the documentation
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Repo Scout version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Public or synthetic reproduction
      description: Do not include credentials or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
